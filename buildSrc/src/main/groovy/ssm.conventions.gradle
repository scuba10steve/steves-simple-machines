plugins {
    id 'java'
    id 'net.neoforged.moddev'
    id 'ssm.repositories'
}

version = rootProject.mod_version
group = 'io.github.scuba10steve.ssm'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.27.0.340"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.27.0.340"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.neoforged:neoforge:${neoforge_version}"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    // Make main compiled classes and their dependencies available to tests.
    // This includes the deobfuscated NeoForge classes from moddev processing.
    classpath += sourceSets.main.runtimeClasspath
}
