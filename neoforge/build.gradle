plugins {
    id 'ssm.neoforge-mod'
}

base {
    archivesName = 'ssm'
}

neoForge {
    mods {
        ssm {
            sourceSet sourceSets.main
            modSourceSets.add(providers.provider { project(':core').sourceSets.main })
        }
    }

    // Some of this module's unit tests (CrushingRecipeTest, SawingRecipeTest) touch vanilla
    // static registries (Items, etc.) that require the game to be bootstrapped. 'ssm.neoforge-mod'
    // has no unitTest block of its own, since mods.ssm isn't declared until each applying
    // project's own build.gradle (this one) runs; it's enabled here instead, after 'mods.ssm' is
    // declared above, matching the pre-split single-module build's ordering. This enables it for
    // the whole :neoforge test source set, not only the 2 tests named above (SimpleEnergyStorageTest
    // doesn't need it, but sharing the setting is harmless).
    unitTest {
        enable()
        testedMod = mods.ssm
    }
}

configurations {
    coreClasses {
        canBeConsumed = false
        canBeResolved = true
    }
}

jar {
    from configurations.coreClasses
}

processResources {
    def replaceProperties = [
        mod_version: mod_version,
        loader_version_range: loader_version_range,
        neoforge_version_range: neoforge_version_range,
        minecraft_version_range: minecraft_version_range,
        jei_version_range: jei_version_range
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(replaceProperties)
    }
}

dependencies {
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.27.0.340"
    coreClasses project(path: ':core', configuration: 'coreOutput')
}
