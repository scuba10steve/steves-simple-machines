plugins {
    id 'ssm.neoforge-mod'
}

base {
    archivesName = 'ssm'
}

neoForge {
    mods {
        ssm {
            sourceSet sourceSets.main
            modSourceSets.add(providers.provider { project(':core').sourceSets.main })
        }
    }

    // Some of this module's unit tests (ProcessingMachineStateTest, CrushingRecipeTest,
    // SawingRecipeTest) touch vanilla static registries (Items, etc.) that require the game to
    // be bootstrapped; 'ssm.neoforge-mod' deliberately has no unitTest block (see its comment),
    // so it's enabled here, after 'mods.ssm' is declared, matching the pre-split single-module
    // build's ordering.
    unitTest {
        enable()
        testedMod = mods.ssm
    }
}

configurations {
    coreClasses {
        canBeConsumed = false
        canBeResolved = true
    }
}

jar {
    from configurations.coreClasses
}

processResources {
    def replaceProperties = [
        mod_version: mod_version,
        loader_version_range: loader_version_range,
        neoforge_version_range: neoforge_version_range,
        minecraft_version_range: minecraft_version_range
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(replaceProperties)
    }
}

dependencies {
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.27.0.340"
    coreClasses project(path: ':core', configuration: 'coreOutput')
}
